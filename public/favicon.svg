  <circle cx="36.5" cy="36.5" r="1.5" fill="#3D2817"/>
  <circle cx="25" cy="35.5" r="0.6" fill="#FBF8F2"/>
  <circle cx="37" cy="35.5" r="0.6" fill="#FBF8F2"/>

  <!-- 微笑 -->
  <path d="M24 43 Q30 47.5 36 43" stroke="#FBF8F2" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- 紅潤腮紅（芥末黃） -->
