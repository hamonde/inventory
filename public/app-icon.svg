<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- PWA 主畫面圖示需不透明背景（米色） -->
  <rect width="512" height="512" fill="#FBF8F2"/>

  <!-- 剪貼板背板 -->
  <rect x="88" y="112" width="336" height="352" rx="40" fill="#AC6342"/>

  <!-- 紙張 -->
  <rect x="112" y="144" width="288" height="304" rx="16" fill="#FBF8F2"/>

  <!-- 上方夾子 -->
  <rect x="184" y="72" width="144" height="88" rx="20" fill="#8A4F32"/>
  <ellipse cx="256" cy="88" rx="24" ry="10" fill="#DFCC60"/>

  <!-- 萌系大眼睛 -->
  <circle cx="184" cy="232" r="24" fill="#3D2817"/>
  <circle cx="328" cy="232" r="24" fill="#3D2817"/>
  <circle cx="190" cy="224" r="8" fill="#FBF8F2"/>
  <circle cx="334" cy="224" r="8" fill="#FBF8F2"/>

  <!-- 微笑 -->
  <path d="M216 288 Q256 316 296 288" stroke="#3D2817" stroke-width="14" fill="none" stroke-linecap="round"/>

  <!-- 腮紅 -->
  <ellipse cx="144" cy="280" rx="18" ry="11" fill="#DFCC60" opacity="0.85"/>
  <ellipse cx="368" cy="280" rx="18" ry="11" fill="#DFCC60" opacity="0.85"/>

  <!-- 紙下方的庫存條目 -->
  <circle cx="144" cy="356" r="12" fill="#AC6342"/>
  <rect x="172" y="348" width="128" height="14" rx="7" fill="#D6C9B8"/>
  <rect x="312" y="348" width="48" height="14" rx="7" fill="#DFCC60"/>

  <circle cx="144" cy="396" r="12" fill="#AC6342"/>
  <rect x="172" y="388" width="112" height="14" rx="7" fill="#D6C9B8"/>
  <rect x="296" y="388" width="64" height="14" rx="7" fill="#DFCC60"/>
</svg>
