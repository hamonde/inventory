<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- iOS Safari 加入主畫面圖示（PNG 才會被 iOS 採用，SVG 多數版本不支援） -->
    <link rel="apple-touch-icon" sizes="180x180" href="app-icon-180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="app-icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="app-icon-512.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#AC6342" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HAMONDE 庫存" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HAMONDE CAFE 庫存系統</title>
    <script>
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
